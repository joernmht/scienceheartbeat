name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Format check
        run: ruff format --check src tests examples
      - name: Type check
        run: mypy src/scienceheartbeat
      - name: Test
        run: pytest --cov=scienceheartbeat --cov-report=term-missing
      - name: Demo is reproducible
        run: |
          python examples/generate_demo.py
          git diff --exit-code examples/demo

  dashboard-js:
    name: dashboard js syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check engine syntax
        run: node --check src/scienceheartbeat/dashboard/assets/app.js
